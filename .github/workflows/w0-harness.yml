# W0 validation harness CI (brief §7 + F-H5 amendment; M1.1 adds the emulator
# acceptance job, M2 adds the B1-B8 checks and the benchmark build type).
#
# Job 1 (build): JVM unit tests + the two debug APKs (standard + alt flavors),
#                uploaded as artifact w0-harness-<shortSHA> (30 days), plus the
#                benchmark build type APKs (H-6/F-H5) as w0-harness-bench-<shortSHA>.
# Job 2 (emulator-acceptance): boots an API 34 Android TV emulator, runs the
#                M1.1 A1-A8 checks (tools/emulator-m1.1-checks.sh) and the M2
#                B1-B8 checks (tools/emulator-m2-checks.sh), uploads
#                screenshots/UI dumps/logs as w0-harness-emulator-m1.1-<shortSHA>.
#                Emulator evidence only — never a W0 test status.
#
# Signing: debug builds only. If the repository secret W0H_DEBUG_KEYSTORE_B64
# exists it is decoded and used, so successive CI builds install over each
# other. Without the secret the runner's default debug key is used and each new
# CI build must be uninstalled before installing. Never commit a keystore.
# No release builds, no Play upload, no publishing steps (the benchmark build
# type is the F-H5-approved exception; CI artifact only).

name: w0-harness

on:
  push:
    paths:
      - 'prototype/w0-harness/**'
      - '.github/workflows/w0-harness.yml'
  pull_request:
    paths:
      - 'prototype/w0-harness/**'
      - '.github/workflows/w0-harness.yml'
  workflow_dispatch:

jobs:
  build:
    name: Unit tests + debug APKs (standard & alt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/w0-harness

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Prepare optional debug keystore from W0H_DEBUG_KEYSTORE_B64
        env:
          W0H_DEBUG_KEYSTORE_B64: ${{ secrets.W0H_DEBUG_KEYSTORE_B64 }}
          W0H_DEBUG_STORE_PASSWORD: ${{ secrets.W0H_DEBUG_STORE_PASSWORD }}
          W0H_DEBUG_KEY_ALIAS: ${{ secrets.W0H_DEBUG_KEY_ALIAS }}
          W0H_DEBUG_KEY_PASSWORD: ${{ secrets.W0H_DEBUG_KEY_PASSWORD }}
        run: |
          if [ -n "$W0H_DEBUG_KEYSTORE_B64" ]; then
            KEYSTORE="$RUNNER_TEMP/w0h-debug.jks"
            printf '%s' "$W0H_DEBUG_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
            {
              echo "W0H_DEBUG_STORE_FILE=$KEYSTORE"
              echo "W0H_DEBUG_STORE_PASSWORD=${W0H_DEBUG_STORE_PASSWORD:-w0h-debug}"
              echo "W0H_DEBUG_KEY_ALIAS=${W0H_DEBUG_KEY_ALIAS:-w0h-debug}"
              echo "W0H_DEBUG_KEY_PASSWORD=${W0H_DEBUG_KEY_PASSWORD:-w0h-debug}"
            } >> "$GITHUB_ENV"
            echo "Secret keystore found: CI builds will install over each other."
          else
            echo "W0H_DEBUG_STORE_FILE=" >> "$GITHUB_ENV"
            echo "No W0H_DEBUG_KEYSTORE_B64 secret: using the runner's default debug key (uninstall before each install)."
          fi

      - name: Build (JVM unit tests + debug APKs + benchmark APKs)
        run: |
          set -o pipefail
          ./gradlew --no-daemon testStandardDebugUnitTest testAltDebugUnitTest assembleStandardDebug assembleAltDebug assembleStandardBenchmark assembleAltBenchmark --stacktrace 2>&1 | tee gradle-output.log

      - name: Publish gradle output tail to job summary (debug aid)
        if: always()
        run: |
          LOG=gradle-output.log
          {
            echo "### Gradle output (last 300 lines)"
            echo ''
            echo '```text'
            tail -n 300 "$LOG" 2>/dev/null || echo '(no log captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Emit key failure lines as ::error:: annotations (readable via the API).
          {
            grep -E "^e: file:" "$LOG" 2>/dev/null | head -n 6
            grep -E "FAILURE:|What went wrong" "$LOG" 2>/dev/null | head -n 2
            grep -A 14 "What went wrong" "$LOG" 2>/dev/null | head -n 14
            grep -E "^> .*(error|failed|Failed|Error)" "$LOG" 2>/dev/null | head -n 6
            grep -E " > [a-zA-Z].*FAILED" "$LOG" 2>/dev/null | head -n 8
          } | head -n 30 | while IFS= read -r line; do
            echo "::error::${line:0:950}"
          done

      - name: Upload debug APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: w0-harness-${{ steps.sha.outputs.short }}
          retention-days: 30
          if-no-files-found: error
          path: |
            prototype/w0-harness/harness/build/outputs/apk/standard/debug/*.apk
            prototype/w0-harness/harness/build/outputs/apk/alt/debug/*.apk

      - name: Upload benchmark APKs as workflow artifact (H-6 / F-H5)
        uses: actions/upload-artifact@v4
        with:
          name: w0-harness-bench-${{ steps.sha.outputs.short }}
          retention-days: 30
          if-no-files-found: error
          path: |
            prototype/w0-harness/harness/build/outputs/apk/standard/benchmark/*.apk
            prototype/w0-harness/harness/build/outputs/apk/alt/benchmark/*.apk

  emulator-acceptance:
    name: Emulator A1-A8 checks (API 34 TV)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: prototype/w0-harness

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build standard debug APK
        run: ./gradlew --no-daemon assembleStandardDebug

      - name: Run A1-A8 acceptance checks on API 34 TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          avd-name: tv34
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 1200
          script: |
            adb install -r prototype/w0-harness/harness/build/outputs/apk/standard/debug/harness-standard-debug.apk || { echo "::error::install-standard-apk-failed rc=$?"; exit 1; }
            adb install -r prototype/w0-harness/harness/build/outputs/apk/alt/debug/harness-alt-debug.apk || echo "::error::alt-apk-install-failed (best-effort only; standard checks continue)"
            adb shell rm -f /sdcard/Android/data/dev.tvbrowse.w0harness/files/tabs-state.json || true
            cd prototype/w0-harness && { tools/emulator-m1.1-checks.sh dev.tvbrowse.w0harness acceptance-out; R1=$?; tools/emulator-m2-checks.sh dev.tvbrowse.w0harness acceptance-out-m2; R2=$?; echo "::notice::m1.1-checks-rc=$R1 m2-checks-rc=$R2"; [ "$R1" = "0" ] && [ "$R2" = "0" ] || { echo "::error::acceptance-checks-failed rc1=$R1 rc2=$R2"; exit 1; }; }

      - name: Report check failures as annotations
        if: failure()
        working-directory: prototype/w0-harness
        run: |
          if [ -f acceptance-out/SUMMARY.md ]; then
            grep -E "FAIL" acceptance-out/SUMMARY.md | cut -c1-300 | head -5 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          S=""
          for f in a5-hook-url.txt a5-screen-logcat.txt a5-hook-export-info.txt a5-hook-export-all.txt a5-hook-mark.txt a5-hook-unlocked.txt a3-logcat.txt a3-down-logcat.txt a7-back.txt; do
            if [ -f "acceptance-out/$f" ]; then
              M="$(grep -oE "NAV_REQUEST|ADB_SCREEN_OPENED|DEVICE_INFO_EXPORTED|EXPORT_ALL|MARK|LOAD_URL|url_edit_exit|ADB_HOOKS" "acceptance-out/$f" | sort | uniq -c | awk '{printf "%s:%s ", $2, $1}')"
              S="$S [$f]${M:-none}"
            else
              S="$S [$f]MISSING"
            fi
          done
          echo "::error::log-markers:$S"
          S2=""
          for f in b1-tab-open.txt b2-tab-switch.txt b3-crash.txt b4-terminate.txt b5-crash-guard.txt b6-standby.txt b6-mru-live.txt b6-none.txt b7-restored.txt b8-fullscreen.txt b8-fullscreen-hide.txt; do
            if [ -f "acceptance-out-m2/$f" ]; then
              M="$(grep -oE "TAB_OPENED|TAB_SWITCH_COMPLETE|RENDER_PROCESS_GONE|RECOVERY_COMPLETE|CRASH_GUARD_TRIPPED|STANDBY_MODE_SET|WEBVIEW_DESTROY|RESTORE_APPLIED|FULLSCREEN_SHOW|FULLSCREEN_HIDE" "acceptance-out-m2/$f" | sort | uniq -c | awk '{printf "%s:%s ", $2, $1}')"
              S2="$S2 [$f]${M:-none}"
            else
              S2="$S2 [$f]MISSING"
            fi
          done
          echo "::error::m2-markers:$S2"
          if [ -f acceptance-out/a2-focus-traversal.txt ]; then
            echo "::error::[a2] $(grep -v '^A2' acceptance-out/a2-focus-traversal.txt | tr '\n' ' ' | head -c 600)"
          fi
          echo "::error::[m1.1-summary] $(grep -E '^- \[' acceptance-out/SUMMARY.md 2>/dev/null | tr '\n' '|' | head -c 1100)"
          if [ -f acceptance-out-m2/SUMMARY.md ]; then
            echo "::error::[m2-summary] $(grep -E '^- \[' acceptance-out-m2/SUMMARY.md | tr '\n' '|' | head -c 1100)"
          fi
          for f in a7-am-start.txt a7-back.txt; do
            [ -f "acceptance-out/$f" ] && echo "::error::[$f] $(tail -c 500 "acceptance-out/$f" | tr '\n' ' ')"
          done
          for f in b1-tab-open.txt b3-crash.txt; do
            [ -f "acceptance-out-m2/$f" ] && echo "::error::[m2-$f] $(tail -c 500 "acceptance-out-m2/$f" | tr '\n' ' ')"
          done
          if [ -f acceptance-out-m2/crash-buffer.txt ]; then
            echo "::error::[m2-crash] $(head -c 500 acceptance-out-m2/crash-buffer.txt | tr '\n' ' ')"
          fi
          echo "::error::[restore-grep] m1.1:$(grep -c "RESTORE_OFFER\|RESTORE_DISCARDED" acceptance-out/*.txt 2>/dev/null | tr '\n' ' ') m2:$(grep -c "RESTORE_OFFER\|RESTORE_DISCARDED" acceptance-out-m2/*.txt 2>/dev/null | tr '\n' ' ')"
          echo "::error::[keyevents-a7] $(grep -c "KEY_EVENT" acceptance-out/a7-back.txt 2>/dev/null) back-keys:$(grep -c "KEYCODE_BACK" acceptance-out/a7-back.txt 2>/dev/null)"

      - name: Publish check summary
        if: always()
        run: |
          for d in acceptance-out acceptance-out-m2; do
            if [ -f "$d/SUMMARY.md" ]; then
              cat "$d/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload emulator evidence as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0-harness-emulator-m1.1-${{ steps.sha.outputs.short }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            prototype/w0-harness/acceptance-out/
            prototype/w0-harness/acceptance-out-m2/
