# W0 validation harness CI (brief §7; M1.1 adds the emulator acceptance job).
#
# Job 1 (build): JVM unit tests + the two debug APKs (standard + alt flavors),
#                uploaded as artifact w0-harness-<shortSHA> (30 days).
# Job 2 (emulator-acceptance): boots an API 34 Android TV emulator, runs the
#                M1.1 A1-A8 checks (tools/emulator-m1.1-checks.sh) and uploads
#                screenshots/UI dumps/logs as w0-harness-emulator-m1.1-<shortSHA>.
#                Emulator evidence only — never a W0 test status.
#
# Signing: debug builds only. If the repository secret W0H_DEBUG_KEYSTORE_B64
# exists it is decoded and used, so successive CI builds install over each
# other. Without the secret the runner's default debug key is used and each new
# CI build must be uninstalled before installing. Never commit a keystore.
# No release builds, no Play upload, no publishing steps (H-6 benchmark build is
# skipped pending founder decision F-H5).

name: w0-harness

on:
  push:
    paths:
      - 'prototype/w0-harness/**'
      - '.github/workflows/w0-harness.yml'
  pull_request:
    paths:
      - 'prototype/w0-harness/**'
      - '.github/workflows/w0-harness.yml'
  workflow_dispatch:

jobs:
  build:
    name: Unit tests + debug APKs (standard & alt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/w0-harness

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Prepare optional debug keystore from W0H_DEBUG_KEYSTORE_B64
        env:
          W0H_DEBUG_KEYSTORE_B64: ${{ secrets.W0H_DEBUG_KEYSTORE_B64 }}
          W0H_DEBUG_STORE_PASSWORD: ${{ secrets.W0H_DEBUG_STORE_PASSWORD }}
          W0H_DEBUG_KEY_ALIAS: ${{ secrets.W0H_DEBUG_KEY_ALIAS }}
          W0H_DEBUG_KEY_PASSWORD: ${{ secrets.W0H_DEBUG_KEY_PASSWORD }}
        run: |
          if [ -n "$W0H_DEBUG_KEYSTORE_B64" ]; then
            KEYSTORE="$RUNNER_TEMP/w0h-debug.jks"
            printf '%s' "$W0H_DEBUG_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
            {
              echo "W0H_DEBUG_STORE_FILE=$KEYSTORE"
              echo "W0H_DEBUG_STORE_PASSWORD=${W0H_DEBUG_STORE_PASSWORD:-w0h-debug}"
              echo "W0H_DEBUG_KEY_ALIAS=${W0H_DEBUG_KEY_ALIAS:-w0h-debug}"
              echo "W0H_DEBUG_KEY_PASSWORD=${W0H_DEBUG_KEY_PASSWORD:-w0h-debug}"
            } >> "$GITHUB_ENV"
            echo "Secret keystore found: CI builds will install over each other."
          else
            echo "W0H_DEBUG_STORE_FILE=" >> "$GITHUB_ENV"
            echo "No W0H_DEBUG_KEYSTORE_B64 secret: using the runner's default debug key (uninstall before each install)."
          fi

      - name: Build (JVM unit tests + both flavor debug APKs)
        run: |
          set -o pipefail
          ./gradlew --no-daemon testStandardDebugUnitTest testAltDebugUnitTest assembleStandardDebug assembleAltDebug --stacktrace 2>&1 | tee gradle-output.log

      - name: Publish gradle output tail to job summary (debug aid)
        if: always()
        run: |
          LOG=gradle-output.log
          {
            echo "### Gradle output (last 300 lines)"
            echo ''
            echo '```text'
            tail -n 300 "$LOG" 2>/dev/null || echo '(no log captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Emit key failure lines as ::error:: annotations (readable via the API).
          {
            grep -E "^e: file:" "$LOG" 2>/dev/null | head -n 6
            grep -E "FAILURE:|What went wrong" "$LOG" 2>/dev/null | head -n 2
            grep -E "> [a-zA-Z].*FAILED$|AssertionError|IllegalStateException|NullPointerException" "$LOG" 2>/dev/null | head -n 4
          } | head -n 12 | while IFS= read -r line; do
            echo "::error::${line:0:950}"
          done

      - name: Upload debug APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: w0-harness-${{ steps.sha.outputs.short }}
          retention-days: 30
          if-no-files-found: error
          path: |
            prototype/w0-harness/harness/build/outputs/apk/standard/debug/*.apk
            prototype/w0-harness/harness/build/outputs/apk/alt/debug/*.apk

  emulator-acceptance:
    name: Emulator A1-A8 checks (API 34 TV)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: prototype/w0-harness

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build standard debug APK
        run: ./gradlew --no-daemon assembleStandardDebug

      - name: Install TV system image (API 34)
        run: |
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null | grep -iE "system-images;android-3[0-9];android-tv" | head -20 | tee tv-images-available.txt || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          # API 34 TV images ship as 32-bit x86 (see e.g. android-tv CI setups).
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-34;android-tv;x86" 2>&1 | tee sdkmanager-install.log
          test -d "$ANDROID_HOME/system-images/android-34/android-tv/x86"

      - name: Report sdkmanager failure (diagnostics)
        if: failure()
        run: |
          {
            echo '### sdkmanager diagnostics'
            echo '```text'
            tail -n 60 sdkmanager-install.log 2>/dev/null || true
            echo '--- available TV images ---'
            cat tv-images-available.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 sdkmanager-install.log 2>/dev/null | head -n 6 | while IFS= read -r line; do
            echo "::error::${line:0:950}"
          done

      - name: Create AVD
        run: |
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          echo no | "$AVDMANAGER" create avd -n tv34 -k "system-images;android-34;android-tv;x86" -d tv_1080p \
            || echo no | "$AVDMANAGER" create avd -n tv34 -k "system-images;android-34;android-tv;x86" \
            || echo no | "$AVDMANAGER" create avd -n tv34 -k "system-images;android-34;android-tv;x86" -d pixel

      - name: Boot emulator (background)
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd tv34 \
            -no-window -no-audio -gpu swiftshader_indirect -no-boot-anim -accel on \
            -no-snapshot -wipe-data > emulator-boot.log 2>&1 &

      - name: Wait for boot
        run: |
          adb wait-for-device
          for i in $(seq 1 90); do
            BOOTED="$(adb shell getprop sys.boot_completed | tr -d '\r')"
            if [ "$BOOTED" = "1" ]; then echo "boot completed"; exit 0; fi
            sleep 5
          done
          echo "emulator did not finish booting"; tail -n 100 emulator-boot.log; exit 1

      - name: Install APKs
        run: |
          adb install -r harness/build/outputs/apk/standard/debug/harness-standard-debug.apk
          adb install -r harness/build/outputs/apk/alt/debug/harness-alt-debug.apk || echo "(alt install failed; standard checks continue)"

      - name: Run A1-A8 acceptance checks
        run: tools/emulator-m1.1-checks.sh dev.tvbrowse.w0harness acceptance-out

      - name: Publish check summary
        if: always()
        run: |
          if [ -f acceptance-out/SUMMARY.md ]; then
            cat acceptance-out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload emulator evidence as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0-harness-emulator-m1.1-${{ steps.sha.outputs.short }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            prototype/w0-harness/acceptance-out/
